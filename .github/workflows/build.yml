name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm AI_Classroom_Mouse.spec
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/FingerMouse -DestinationPath dist/FingerMouse-windows-x64.zip
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Finger Mouse.app" "dist/FingerMouse-${{ matrix.platform }}.zip"
      - name: Archive Linux app
        if: runner.os == 'Linux'
        run: zip -qr dist/FingerMouse-linux-x64.zip dist/FingerMouse
      - uses: actions/upload-artifact@v4
        with:
          name: FingerMouse-${{ matrix.platform }}
          path: dist/FingerMouse-*.zip
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: FingerMouse-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*.zip
          generate_release_notes: true
