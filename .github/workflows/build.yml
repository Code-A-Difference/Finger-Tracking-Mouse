name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build application
        run: python -m PyInstaller --clean --noconfirm AI_Classroom_Mouse.spec
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: iscc /DMyAppVersion=${{ github.ref_name }} installer/FingerMouse.iss
      - name: Sign Windows installer
        if: runner.os == 'Windows' && env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes('signing.pfx', [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          signtool sign /fd SHA256 /f signing.pfx /p $env:WINDOWS_CERT_PASSWORD dist/FingerMouse-windows-x64-setup.exe
          Remove-Item -LiteralPath signing.pfx
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: hdiutil create -volname "Finger Mouse" -srcfolder "dist/Finger Mouse.app" -ov -format UDZO "dist/FingerMouse-${{ matrix.platform }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: FingerMouse-${{ matrix.platform }}
          path: |
            dist/FingerMouse-*.exe
            dist/FingerMouse-*.dmg
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: FingerMouse-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*.exe
            release-files/*.dmg
          generate_release_notes: true
