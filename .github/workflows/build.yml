name: Build, test and release

# Every push and pull request: test, build and package on all four platforms,
# and self-test each built app. The installers are kept as workflow artifacts.
# A version tag (v2.2.0): the same, signed where secrets are configured, and
# published as a GitHub Release. See RELEASING.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, runner: windows-2022, asset: FingerMouse-windows-x64-setup.exe }
          - { platform: macos-arm64, runner: macos-15, asset: FingerMouse-macos-arm64.dmg, arch: arm64 }
          - { platform: macos-x64, runner: macos-15-intel, asset: FingerMouse-macos-x64.dmg, arch: x64 }
          - { platform: linux-x86_64, runner: ubuntu-22.04, asset: FingerMouse-linux-x86_64.AppImage }
    env:
      # Only a tag build signs, and only if the secrets exist. Secrets can't be
      # read in `if:` directly, hence these flags.
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      HAS_WINDOWS_PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
      HAS_AZURE_SIGNING: ${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
      HAS_MACOS_NOTARY: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Version
        id: version
        shell: bash
        run: |
          version=$(python -c "import app_version; print(app_version.APP_VERSION)")
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match APP_VERSION $version in app_version.py"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 \
            libxcb-render-util0 libxcb-image0 libdbus-1-3 libgles2
          # libgles2: MediaPipe's native library links OpenGL ES (every desktop has it).
          # Deliberately no PortAudio: the app must start without it (see hand_tracker.py).

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python tools/fetch_model.py

      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          run=""; [ "$RUNNER_OS" = "Linux" ] && run="xvfb-run -a"
          $run python -m pytest -q -rfE --tb=short --capture=sys > pytest.log 2>&1
          status=$?
          cat pytest.log
          # Failures become annotations: readable on the run page and the public API.
          [ $status -ne 0 ] && python tools/ci_annotate.py pytest.log
          exit $status

      # ---- macOS signing keychain (only with secrets, only for tags) ----------
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.RELEASE == 'true' && env.HAS_MACOS_CERT == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Build app
        run: python -m PyInstaller --noconfirm --clean FingerMouse.spec

      - name: Self-test the built app
        shell: bash
        run: |
          set +e
          case "$RUNNER_OS" in
            Windows) powershell -Command "\$p = Start-Process dist/FingerMouse/FingerMouse.exe -ArgumentList '--self-test','selftest.json' -Wait -PassThru; exit \$p.ExitCode" ;;
            macOS)   "dist/Finger Mouse.app/Contents/MacOS/FingerMouse" --self-test selftest.json > selftest.out 2>&1 ;;
            Linux)   xvfb-run -a dist/FingerMouse/FingerMouse --self-test selftest.json > selftest.out 2>&1 ;;
          esac
          status=$?
          cat selftest.out 2>/dev/null
          cat selftest.json
          if [ $status -ne 0 ]; then
            # The result, and whatever the app printed, as annotations readable without the full log.
            report=$(cat selftest.json 2>/dev/null || echo "no selftest.json: the app exited with $status before writing it")
            echo "::error title=self-test failed ($status)::$(echo "$report" | tr '\n' ' ' | cut -c1-3000)"
            if [ -s selftest.out ]; then
              echo "::error title=self-test output::$(tail -n 40 selftest.out | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-4000)"
            fi
          fi
          exit $status

      # ---- Windows ----------------------------------------------------------------
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Sign FingerMouse.exe (Azure Artifact Signing)
        if: runner.os == 'Windows' && env.RELEASE == 'true' && env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: dist/FingerMouse
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # A .pfx certificate, if that's how signing is set up (tags only).
          WINDOWS_CERT_PFX_BASE64: ${{ env.RELEASE == 'true' && secrets.WINDOWS_CERT_PFX_BASE64 || '' }}
          WINDOWS_CERT_PASSWORD: ${{ env.RELEASE == 'true' && secrets.WINDOWS_CERT_PASSWORD || '' }}
        run: packaging/windows/build_installer.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Sign installer (Azure Artifact Signing)
        if: runner.os == 'Windows' && env.RELEASE == 'true' && env.HAS_AZURE_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\FingerMouse-windows-x64-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ---- macOS ------------------------------------------------------------------
      - name: Build disk image
        if: runner.os == 'macOS'
        env:
          MACOS_NOTARY_KEY_P8_BASE64: ${{ env.RELEASE == 'true' && secrets.MACOS_NOTARY_KEY_P8_BASE64 || '' }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          if [ -n "$MACOS_NOTARY_KEY_P8_BASE64" ] && [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            export MACOS_NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
            echo "$MACOS_NOTARY_KEY_P8_BASE64" | base64 --decode > "$MACOS_NOTARY_KEY_PATH"
          fi
          packaging/macos/build_dmg.sh ${{ matrix.arch }}
          rm -f "$RUNNER_TEMP/notary.p8"

      # ---- Linux ------------------------------------------------------------------
      - name: Build AppImage
        if: runner.os == 'Linux'
        run: packaging/linux/build_appimage.sh ${{ steps.version.outputs.version }}

      - name: Self-test the AppImage on a clean Ubuntu 24.04
        if: runner.os == 'Linux'
        run: |
          # A fresh container with only what a desktop has, so a library that
          # happens to be on the build machine can't hide a missing one.
          packages="xvfb xauth libgl1 libegl1 libgles2 libfontconfig1 libxkbcommon-x11-0 libxcb-cursor0
                    libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0
                    libxcb-image0 libdbus-1-3"
          docker run --rm -v "$PWD/dist:/dist" -e PACKAGES="$packages" ubuntu:24.04 bash -c '
            apt-get update -qq &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $PACKAGES >/dev/null &&
            cd /tmp &&
            xvfb-run -a /dist/FingerMouse-linux-x86_64.AppImage --appimage-extract-and-run --self-test /tmp/result.json
            status=$?; cat /tmp/result.json; exit $status'

      - name: Report signing status
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) powershell -Command "Get-AuthenticodeSignature dist/${{ matrix.asset }} | Format-List Status,StatusMessage,SignerCertificate" ;;
            macOS)   codesign -dv --verbose=2 "dist/Finger Mouse.app" 2>&1 | head -8; spctl -a -t open --context context:primary-signature -v "dist/${{ matrix.asset }}" 2>&1 || true ;;
            Linux)   echo "AppImages are not code-signed; the release lists SHA-256 checksums." ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write          # to refresh the download page afterwards
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true
      - name: Checksums
        working-directory: release-files
        run: sha256sum FingerMouse-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          name: Finger Mouse ${{ github.ref_name }}
          body_path: packaging/release-notes.md
          generate_release_notes: true
          files: |
            release-files/FingerMouse-*
            release-files/SHA256SUMS.txt
      - name: Refresh the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
