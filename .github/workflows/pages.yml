name: Publish download page

# Publishes website/downloads.html with a release.json snapshot of the latest
# release's files beside it, so the page shows real, current downloads. The
# release workflow triggers this after publishing a release.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Prepare site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          cp website/downloads.html _site/index.html
          # Only the fields the page uses. If there's no release yet, the page
          # says so instead of linking anything.
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" \
            --jq '{tag_name, published_at, html_url, assets: [.assets[] | {name, size, browser_download_url}]}' \
            > _site/release.json || echo '{}' > _site/release.json
          cat _site/release.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
